<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House districts</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --ink-2: #555; --muted: #8a8a8a;
    --grid: #e6e6e6; --county: #9aa3ad; --county-hi: #1a1a1a; --ideal: #d0452f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --ink: #ececec; --ink-2: #b4b4b4; --muted: #808080;
            --grid: #2c2f33; --county: #5d6670; --county-hi: #ffffff; --ideal: #f06a52; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--ink-2); margin: 0 0 12px; }
  .controls { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; color: var(--ink-2); }
  .legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 13px; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 0;
    vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
  .legend .l-county::before { border-color: var(--county); border-top-width: 1px; }
  .legend .l-ideal::before { border-color: var(--ideal); border-top-width: 3px; }
  svg { width: 100%; height: auto; display: block; }
  .axis text { fill: var(--muted); font-size: 12px; }
  .axis path, .axis line { stroke: var(--grid); }
  .grid line { stroke: var(--grid); }
  .grid path { display: none; }
  .county { fill: none; stroke: var(--county); stroke-width: 1; opacity: 0.7; }
  .county.hi { stroke: var(--county-hi); stroke-width: 2; opacity: 1; }
  .ideal { fill: none; stroke: var(--ideal); stroke-width: 3; }
  .ideal-label { fill: var(--ideal); font-weight: 600; font-size: 12px; }
  .hi-label { fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke;
              stroke: var(--bg); stroke-width: 4px; }
  #tip { position: fixed; pointer-events: none; background: var(--bg); color: var(--ink);
         border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; font-size: 12px;
         box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; }
</style>
</head>

:"Davidson & Wilson","seats":1,"pop":[25029,25466,194056,246783,282534,348076,427411]},{"name":"Giles, Lewis, Maury, & Wayne","seats":1,"pop":[33543,33199,66934,62957,67867,67423,61623]},{"name":"Williamson, Cheatham, & Robertson","seats":1,"pop":[11077,12947,59069,60061,64194,60498,62030]},{"name":"Montgomery & Houston","seats":1,"pop":[3326,4202,38477,36437,39778,49504,60439]},{"name":"Humphreys & Perry","seats":1,"pop":[22021,22296,21247,19186,19956,17492,16784]},{"name":"Benton & Decatur","seats":1,"pop":[153557,191439,22244,21343,22237,20937,18986]},{"name":"Henry, Weakley, & Carroll","seats":1,"pop":[19026,18548,82565,81826,81353,78343,69978]},{"name":"Madison & Henderson","seats":1,"pop":[15224,14860,36786,37556,39644,37563,34200]},{"name":"Tipton & Lauderdale","seats":1,"pop":[24935,28120,51752,50904,52497,54829,50408]}]};

const W = 960, H = 560, M = { top: 20, right: 150, bottom: 36, left: 64 };
const svg = d3.select("#chart").append("svg").attr("viewBox", `0 0 ${W} ${H}`);
const x = d3.scalePoint().domain(DATA.years).range([M.left, W - M.right]);
const gGrid = svg.append("g").attr("class", "grid").attr("transform", `translate(${M.left},0)`);
const gX = svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - M.bottom})`);
const gY = svg.append("g").attr("class", "axis").attr("transform", `translate(${M.left},0)`);
const gLines = svg.append("g");
const gIdeal = svg.append("g");
const hiLabel = svg.append("text").attr("class", "hi-label");
const tip = d3.select("#tip");

gX.call(d3.axisBottom(x).tickFormat(d3.format("d")));

const baseOrder = new Map(DATA.districts.map((d, i) => [d.name, i]));
function clearHover() {
  gLines.selectAll("path").classed("hi", false)
    .sort((a, b) => baseOrder.get(a.name) - baseOrder.get(b.name));
  hiLabel.text("");
  tip.style("display", "none");
}

function render() {
  const perSeat = document.getElementById("perSeat").checked;
  const log = document.getElementById("logScale").checked;
  const series = DATA.districts.map(d => ({
    name: d.name, seats: d.seats,
    vals: d.pop.map(p => perSeat ? p / d.seats : p)
  }));
  const max = d3.max(series, s => d3.max(s.vals));
  const min = d3.min(series, s => d3.min(s.vals));
  const y = (log ? d3.scaleLog().domain([min * 0.9, max * 1.05])
                 : d3.scaleLinear().domain([0, max * 1.05]).nice())
            .range([H - M.bottom, M.top]);
  const line = d3.line().x((v, i) => x(DATA.years[i])).y(v => y(v));

  gY.call(d3.axisLeft(y).ticks(8, log ? "~s" : "~s"));
  gGrid.call(d3.axisLeft(y).ticks(8).tickSize(-(W - M.left - M.right)).tickFormat(""));

  gLines.selectAll("path").data(series, s => s.name).join("path")
    .attr("class", "county")
    .attr("d", s => line(s.vals))
    .on("mouseenter", function (e, s) {
      clearHover();
      d3.select(this).classed("hi", true).raise();
      const last = s.vals[s.vals.length - 1];
      hiLabel.attr("x", x(1960) + 6).attr("y", y(last) + 4).text(s.name);
    })
    .on("mousemove", (e, s) => {
      const rows = DATA.years.map((yr, i) =>
        `<tr><td>${yr}</td><td style="text-align:right;padding-left:10px">${d3.format(",")(Math.round(s.vals[i]))}</td></tr>`).join("");
      tip.style("display", "block").style("left", (e.clientX + 14) + "px").style("top", (e.clientY + 14) + "px")
        .html(`<strong>${s.name}</strong>${s.seats > 1 ? ` (${s.seats} seats)` : ""}<table>${rows}</table>`);
    })
    .on("mouseleave", clearHover);
  gLines.on("mouseleave", clearHover);

  gIdeal.raise();
  gIdeal.selectAll("path").data([DATA.ideal]).join("path").attr("class", "ideal").attr("d", line)
    .style("pointer-events", "none");
  gIdeal.selectAll("text").data([DATA.ideal]).join("text").attr("class", "ideal-label")
    .attr("x", x(1960) + 6).attr("y", d => y(d[d.length - 1]) + 4).text("Ideal population");
  hiLabel.raise();
}

d3.selectAll("#perSeat, #logScale").on("change", render);
render();
</script>
</body>
</html>
