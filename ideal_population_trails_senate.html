<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideal Population Trails Senate</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  @font-face { font-family: "Benton"; src: url("Benton Sans/Benton Sans Book.otf"); }
  @font-face { font-family: "BentonStrong"; src: url("Benton Sans/Benton Sans Bold.otf"); }
  @font-face { font-family: "BentonMedium"; src: url("Benton Sans/Benton Sans Medium.otf"); }

  :root {
    --bg: #ffffff; --text: #000000; --grid: #dbdada;
    --yellow: #ffcf01; --red: #ed1c24; --blue: #007194; --orange: #f67613; --green: #12a657; --purple: #711471;
    --font-sans: "Benton", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  body { font-size: 17px; line-height: 1.55; }
  b, strong { font-family: "BentonStrong"; font-weight: normal; }

  header { max-width: 1280px; margin: 0 auto; padding: 40px 16px 8px; }
  #title { max-width: 800px; padding-top: 14px; }
  h1 { margin: 0; font-size: 20px; line-height: 1.6; font-family: "BentonStrong"; font-weight: normal; }

  .scrolly { position: relative; max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .graphic { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; z-index: 1; }
  .graphic svg { width: 100%; height: auto; max-height: 94vh; display: block; }
  .steps { position: relative; z-index: 2; margin-top: -100vh; }
  .step { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .step:first-child { margin-top: 30vh; }
  .step:last-child { margin-bottom: 50vh; }
  .step .card { background: var(--bg); border: 1px solid black; padding: 18px 20px; max-width: 420px; }
  .step .card:empty { display: none; }

  #chart svg { max-width: 1200px; margin: 0 auto; }
  .axis text { font-size: 13px; fill: var(--text); }
  .axis line { stroke: var(--grid); }
  .trail { fill: none; stroke-width: 1; stroke-opacity: 0.4; }
  .ideal-line { fill: none; stroke: var(--text); stroke-width: 2; }
  .range { stroke: var(--text); stroke-width: 1.5; }
  .range-label { font-size: 13px; stroke: var(--bg); stroke-width: 3px; paint-order: stroke; }
  .note { font-size: 13px; fill: var(--text); }
  .ideal-label { font-family: "BentonStrong"; font-size: 15px; }
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:1000;background:#ed1c24;color:#fff;font-family:'BentonStrong',-apple-system,sans-serif;font-size:14px;letter-spacing:0.08em;text-align:center;padding:8px 16px;">DRAFT - FOR TESTING ONLY DO NOT SHARE</div>
<header>
  <div id="title"><h1></h1></div>
</header>

<section class="scrolly">
  <div class="graphic"><div style="width:100%" id="chart"></div></div>
  <div class="steps">
    <div class="step" data-scene="0"><div class="card"></div></div>
  </div>
</section>

<script>
// Population per seat for each Senate district, 1900-1960 (v = 1900). Where a
// county has more than 1 seat, its population is divided equally.
const YEARS = [1900, 1910, 1920, 1930, 1940, 1950, 1960];
const YEAR_TOTAL = [2020616,  2184789,  2337885,  2616556,  2915841,  3291718,  3567089];
const YEAR_IDEAL = [61230.8,  66205.7,  70845.0,  79289.6,  88358.8,  99749.0,  108093.6];
const DISTRICTS = [{"name":"Johnson, Carter, Unicoi, Greene, & Washington","seat":1,"seats":1,"v":86328,"pop":[86328,100281,110714,135034,153289,171615,174420]},{"name":"Sullivan & Hawkins","seat":2,"seats":1,"v":49202,"pop":[49202,51707,59177,75204,97608,125557,144607]},{"name":"Hancock, Morgan, Grainger, Claiborne, Union, Campbell, & Scott","seat":3,"seats":1,"v":98230,"pop":[98230,111376,113685,112604,121613,123118,105481]},{"name":"Cocke, Hamblen, Jefferson, Sevier, & Blount","seat":4,"seats":1,"v":146072,"pop":[146072,174736,205597,253655,287589,328979,364564]},{"name":"Knox","seat":5,"seats":1,"v":74302,"pop":[74302,94187,112926,155902,178468,223007,250523]},{"name":"Knox, Loudon, Anderson, & Roane","seat":6,"seats":1,"v":125512,"pop":[125512,148376,172123,217906,252605,337261,373445]},{"name":"McMinn, Bradley, Monroe, & Polk","seat":7,"seats":1,"v":64464,"pop":[64464,68040,72330,75507,84276,88693,90659]},{"name":"Hamilton","seat":8,"seats":1,"v":67102,"pop":[67102,94477,115954,159497,180478,208255,237905]},{"name":"Rhea, Meigs, Bledsoe, Sequatchie, Van Buren, White, & Cumberland","seat":9,"seats":1,"v":57355,"pop":[57355,59603,59158,61672,71807,75433,73132]},{"name":"Fentress, Pickett, Clay, Overton, Putnam, & Jackson","seat":10,"seats":1,"v":65175,"pop":[65175,72455,79636,81655,91594,88494,78138]},{"name":"Marion, Franklin, Grundy, & Warren","seat":11,"seats":1,"v":57485,"pop":[57485,59906,62622,65594,70112,73859,72339]},{"name":"Rutherford, Cannon, & DeKalb","seat":12,"seats":1,"v":62124,"pop":[62124,59458,58670,55434,58072,61550,71679]},{"name":"Wilson & Smith","seat":13,"seats":1,"v":46104,"pop":[46104,43942,43375,39402,41415,40416,39727]},{"name":"Sumner, Trousdale, & Macon","seat":14,"seats":1,"v":51239,"pop":[51239,52541,58837,63270,69613,71077,74793]},{"name":"Montgomery & Robertson","seat":15,"seats":1,"v":61046,"pop":[61046,59138,57886,59073,62392,71210,82980]},{"name":"Davidson","seat":16,"seats":2,"v":61408,"pop":[61408,74739,83908,111427,128634,160879,199872]},{"name":"Davidson","seat":17,"seats":2,"v":61408,"pop":[61408,74739,83908,111427,128634,160879,199872]},{"name":"Bedford, Coffee, & Moore","seat":18,"seats":1,"v":45125,"pop":[45125,43092,43572,41915,46203,50624,55207]},{"name":"Lincoln & Marshall","seat":19,"seats":1,"v":62637,"pop":[62637,65265,69610,76481,81329,85752,84484]},{"name":"Maury, Perry, & Lewis","seat":20,"seats":1,"v":30536,"pop":[30536,33668,30874,29954,32524,33060,32578]},{"name":"Hickman, Williamson, & Cheatham","seat":21,"seats":1,"v":52908,"pop":[52908,51280,49664,45483,50021,46827,46557]},{"name":"Giles, Lawrence, & Wayne","seat":22,"seats":1,"v":61373,"pop":[61373,62260,67418,66926,71604,69643,62367]},{"name":"Dickson, Humphreys, Houston, & Stewart","seat":23,"seats":1,"v":53733,"pop":[53733,54947,53700,49363,52120,44328,42995]},{"name":"Henry & Carroll","seat":24,"seats":1,"v":48458,"pop":[48458,49405,51512,52564,51855,50381,45751]},{"name":"Madison, Henderson, & Chester","seat":25,"seats":1,"v":45773,"pop":[45773,42476,46455,48159,50768,48712,43769]},{"name":"Hardeman, McNairy, Hardin, Decatur, & Benton","seat":26,"seats":1,"v":107252,"pop":[107252,103533,97216,93765,103990,101524,99599]},{"name":"Gibson","seat":27,"seats":1,"v":39408,"pop":[39408,41630,43388,46528,44835,48132,44699]},{"name":"Lake, Obion, & Weakley","seat":28,"seats":1,"v":68200,"pop":[68200,70579,68521,68834,71711,68673,60756]},{"name":"Dyer, Lauderdale, & Crockett","seat":29,"seats":1,"v":61614,"pop":[61614,64902,68915,72170,76711,75144,65975]},{"name":"Tipton & Shelby","seat":30,"seats":1,"v":159561,"pop":[159561,197313,229212,312111,364363,487913,631933]},{"name":"Haywood & Fayette","seat":31,"seats":1,"v":54890,"pop":[54890,56167,56885,54954,58021,53747,47970]},{"name":"Shelby","seat":32,"seats":2,"v":76778,"pop":[76778,95720,111608,153241,179125,241196,313510]},{"name":"Shelby","seat":33,"seats":2,"v":76778,"pop":[76778,95720,111608,153241,179125,241196,313510]}];
const IDEAL = YEAR_IDEAL[0];
const W = 1200, H = 680;
const svg = d3.select("#chart").append("svg").attr("viewBox", `0 0 ${W} ${H}`);
svg.append("text").attr("class", "note").attr("text-anchor", "end").attr("x", W).attr("y", H - 6)
  .text("For counties that have more than 1 seat, county population is divided equally.");

// Decades across; up is population per seat as a multiple of that decade's
// ideal (log scale), so the ideal is a flat line at 1×.
const SC = { left: 120, right: 1110, top: 40, bottom: 610 };
const scX = d3.scalePoint().domain(YEARS).range([SC.left, SC.right]).padding(0.5);
const scY = d3.scaleLog().domain([0.2, 10]).range([SC.bottom, SC.top]);
const ratio = (d, yi) => d.pop[yi] / YEAR_IDEAL[yi];
const axes = svg.append("g").attr("class", "axis");
axes.selectAll("g.y").data([0.25, 0.5, 1, 2, 4, 8]).join("g")
  .attr("class", "y").attr("transform", v => `translate(0,${scY(v)})`)
  .call(g => g.append("line").attr("x1", SC.left - 10).attr("x2", SC.right))
  .call(g => g.append("text").attr("x", SC.left - 16).attr("dy", "0.35em").attr("text-anchor", "end")
    .text(v => `${v}×`));
axes.selectAll("text.x").data(YEARS).join("text").attr("class", "x")
  .attr("x", scX).attr("y", SC.bottom + 28).attr("text-anchor", "middle").text(y => y);

// Circle area in proportion to population on the 1900 scale.
const R0 = 6;
const radius = v => R0 * Math.sqrt(v / IDEAL);

// Black below the 1900 ideal, grey at it, green above; values beyond the 1900
// extremes hold the end colors.
const css = getComputedStyle(document.documentElement);
const color = d3.scaleLinear()
  .domain([Math.log(d3.min(DISTRICTS, d => d.v) / IDEAL), 0, Math.log(d3.max(DISTRICTS, d => d.v) / IDEAL)])
  .range([css.getPropertyValue("--text").trim(), "#e6e6e6", css.getPropertyValue("--green").trim()])
  .interpolate(d3.interpolateLab).clamp(true);

// At each decade the circles are pushed sideways within the column so none
// overlap; between decades they travel in straight lines.
const districts = DISTRICTS.map(d => ({ d, stops: [] }));
YEARS.forEach((year, yi) => {
  const pts = districts.map(n => ({ n, r: radius(n.d.pop[yi]), x: scX(year), y: scY(ratio(n.d, yi)), fy: scY(ratio(n.d, yi)) }));
  d3.forceSimulation(pts)
    .force("x", d3.forceX(scX(year)).strength(0.1))
    .force("collide", d3.forceCollide(p => p.r + 1).iterations(4))
    .stop().tick(300);
  pts.forEach(p => { p.n.stops[yi] = { x: p.x, cx: scX(year), y: p.y, r: p.r, c: Math.log(p.n.d.pop[yi] / IDEAL) }; });
});

const lerp = (a, b, t) => a + (b - a) * t;
function at(n, t) {
  const i = Math.min(Math.floor(t), YEARS.length - 2), f = t - i, a = n.stops[i], b = n.stops[i + 1];
  return { x: lerp(a.x, b.x, f), cx: lerp(a.cx, b.cx, f), y: lerp(a.y, b.y, f), r: lerp(a.r, b.r, f), c: color(lerp(a.c, b.c, f)) };
}

const trails = svg.append("g").selectAll("path").data(districts).join("path").attr("class", "trail");
// Each decade's range, smallest to largest, drawn when the circles arrive;
// it grows out from the ideal line.
const ranges = svg.append("g").selectAll("line").data(YEARS).join("line").attr("class", "range")
  .each(function (year, yi) {
    const ys = DISTRICTS.map(d => scY(ratio(d, yi)));
    Object.assign(this.dataset, { top: d3.min(ys), bottom: d3.max(ys) });
  })
  .attr("x1", scX).attr("x2", scX).attr("y1", scY(1)).attr("y2", scY(1)).attr("opacity", 0);
// Difference from that decade's ideal at each end: + above, − below, placed
// clear of the end circles.
const rangeLabels = svg.append("g").selectAll("text")
  .data(YEARS.flatMap((year, yi) => {
    const hi = d3.greatest(DISTRICTS, d => d.pop[yi]), lo = d3.least(DISTRICTS, d => d.pop[yi]);
    return [[hi, -1], [lo, 1]].map(([d, dir]) => ({
      yi, x: scX(year),
      y: scY(ratio(d, yi)) + dir * (radius(d.pop[yi]) + (dir < 0 ? 6 : 14)),
      text: d3.format("+,")(Math.round(d.pop[yi] - YEAR_IDEAL[yi]))
    }));
  }))
  .join("text").attr("class", "range-label").attr("text-anchor", "middle")
  .attr("x", d => d.x).attr("y", d => d.y).text(d => d.text).attr("opacity", 0);
let reached = -1;
function showRanges(upTo) {
  const isNew = yi => yi > reached && yi <= upTo;
  ranges.filter((_, yi) => isNew(yi))
    .attr("opacity", 1)
    .transition().duration(500).ease(d3.easeCubicOut)
    .attr("y1", function () { return +this.dataset.top; })
    .attr("y2", function () { return +this.dataset.bottom; });
  rangeLabels.filter(d => isNew(d.yi))
    .transition().delay(400).duration(300).attr("opacity", 1);
  reached = Math.max(reached, upTo);
}
// Larger circles underneath smaller ones.
const circles = svg.append("g").selectAll("circle")
  .data(d3.sort(districts, n => -d3.max(n.d.pop))).join("circle");

// Ideal population per seat, drawn along with the circles; labelled at the
// end, just past the 1960 column.
const idealStops = YEARS.map(year => ({ x: scX(year), y: scY(1) }));
const idealLine = svg.append("path").attr("class", "ideal-line");
const lastCol = d3.max(districts, n => n.stops[YEARS.length - 1].x + n.stops[YEARS.length - 1].r);
const idealLabel = svg.append("text").attr("class", "ideal-label").attr("opacity", 0)
  .attr("y", idealStops[YEARS.length - 1].y);
idealLabel.selectAll("tspan").data(["ideal", "population"]).join("tspan")
  .attr("x", lastCol + 10).attr("dy", (_, i) => i ? "1.2em" : "-0.25em").text(t => t);

// t runs 0..6 through the decades; each trail is the path so far, drawn
// through the decade positions rather than the nudged circle positions.
let t = 0;
function render() {
  districts.forEach(n => { n.cur = at(n, t); });
  circles.attr("cx", n => n.cur.x).attr("cy", n => n.cur.y).attr("r", n => n.cur.r).style("fill", n => n.cur.c);
  trails.attr("d", n => d3.line()([...n.stops.slice(0, Math.floor(t) + 1), n.cur].map(p => [p.cx, p.y])))
    .style("stroke", n => n.cur.c);
  const i = Math.min(Math.floor(t), YEARS.length - 2), f = t - i;
  const head = { x: lerp(idealStops[i].x, idealStops[i + 1].x, f), y: lerp(idealStops[i].y, idealStops[i + 1].y, f) };
  idealLine.attr("d", d3.line()([...idealStops.slice(0, Math.floor(t) + 1), head].map(p => [p.x, p.y])));
  // A decade counts as reached once the circles have settled on it.
  const upTo = Math.floor(t + 1e-6);
  if (upTo > reached) showRanges(upTo);
}
render();

// ---------- scenes ----------
const PER_DECADE = 1100;
function play() {
  svg.interrupt("play");
  idealLabel.interrupt().attr("opacity", 0);
  ranges.interrupt().attr("opacity", 0).attr("y1", scY(1)).attr("y2", scY(1));
  rangeLabels.interrupt().attr("opacity", 0);
  reached = -1;
  t = 0; render();
  svg.transition("play").duration(PER_DECADE * (YEARS.length - 1)).ease(d3.easeLinear)
    .tween("t", () => u => {
      // Ease each decade so circles settle briefly on every year.
      const total = u * (YEARS.length - 1), i = Math.min(Math.floor(total), YEARS.length - 2);
      t = i + d3.easeCubicInOut(total - i);
      render();
    })
    .on("end", () => idealLabel.transition().duration(500).attr("opacity", 1));
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll(".step").forEach(el => el.classList.toggle("active", el === e.target));
    play();
  });
}, { rootMargin: "-45% 0px -45% 0px" });
document.querySelectorAll(".step").forEach(el => observer.observe(el));
</script>
</body>
</html>
